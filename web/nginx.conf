server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由：找不到文件回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API（容器编排里 hify-host 为后端服务名）
    location /api/ {
        proxy_pass http://hify-host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE 流式必需：关闭缓冲、长读超时（对齐后端 120s）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
        proxy_set_header Connection '';
    }
}
